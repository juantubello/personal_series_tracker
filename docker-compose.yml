services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_PATH: /data/app.db
    volumes:
      - ./data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
        NEXT_PUBLIC_CF_ACCESS_CLIENT_ID: ${NEXT_PUBLIC_CF_ACCESS_CLIENT_ID:-}
        NEXT_PUBLIC_CF_ACCESS_CLIENT_SECRET: ${NEXT_PUBLIC_CF_ACCESS_CLIENT_SECRET:-}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_HTTP_PORT:-3000}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      nginx:
        condition: service_started
    profiles:
      - tunnel
    restart: unless-stopped
