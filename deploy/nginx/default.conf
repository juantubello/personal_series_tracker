upstream pipiseries_web {
  server web:3000;
  keepalive 32;
}

upstream pipiseries_api {
  server api:8080;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # Cloudflare Access headers are forwarded to the API so production auth can
  # validate the signed JWT instead of trusting only the reverse proxy.
  proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
  proxy_set_header Cf-Connecting-Ip $http_cf_connecting_ip;
  proxy_set_header Cf-Ray $http_cf_ray;

  location = /health {
    proxy_pass http://pipiseries_api/health;
  }

  location /api/ {
    proxy_pass http://pipiseries_api/;
  }

  location / {
    proxy_pass http://pipiseries_web;
  }
}
